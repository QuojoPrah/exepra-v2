<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: transparent; }
  body.solid { background: radial-gradient(ellipse at 50% 45%, #e9c2b6 0%, #d9a293 55%, #c4877a 100%); }
  .stage { position: absolute; inset: 0; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,236,210,.35), rgba(255,236,210,0) 60%); }
  .logo { position: absolute; top: 420px; width: 100%; text-align: center; }
  .wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 112px; letter-spacing: 20px; color: #fffaf3; padding-left: 20px; text-shadow: 0 2px 30px rgba(110,50,40,.45); white-space: nowrap; }
  .rule { margin: 34px auto 0; height: 1.5px; background: #f3dcb8; }
  .tag { margin-top: 30px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 52px; color: #fff4e8; letter-spacing: 3px; text-shadow: 0 2px 18px rgba(110,50,40,.4); }
  .cta { position: absolute; bottom: 330px; width: 100%; text-align: center; }
  .cta span { display: inline-block; font-family: 'Jost', sans-serif; font-weight: 400; font-size: 40px; letter-spacing: 16px; padding: 30px 44px 30px 60px; color: #fffaf3; border: 1.5px solid rgba(255,244,232,.9); text-shadow: 0 2px 14px rgba(110,50,40,.35); }
</style>
</head>
<body>
<div class="stage">
  <div class="glow" id="glow"></div>
  <div class="logo">
    <div class="wordmark" id="wm">VESTIR HER</div>
    <div class="rule" id="rule"></div>
    <div class="tag" id="tag">Wear the feeling.</div>
  </div>
  <div class="cta"><span id="cta">SHOP THE LOOK</span></div>
</div>
<script>
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  const seg = (t, a, b) => ease((t - a) / (b - a));
  window.render = t => {
    const w = seg(t, 0.0, 1.0), r = seg(t, 0.5, 1.3), g = seg(t, 0.9, 1.6), c = seg(t, 1.3, 2.0);
    const wm = document.getElementById('wm');
    wm.style.opacity = w;
    wm.style.letterSpacing = (40 - 20 * w) + 'px';
    wm.style.filter = `blur(${(1 - w) * 12}px)`;
    document.getElementById('rule').style.width = (360 * r) + 'px';
    const tag = document.getElementById('tag');
    tag.style.opacity = g; tag.style.transform = `translateY(${(1 - g) * 18}px)`;
    const cta = document.getElementById('cta');
    cta.style.opacity = c; cta.style.transform = `translateY(${(1 - c) * 24}px)`;
    document.getElementById('glow').style.opacity = 0.6 + 0.4 * Math.sin(t * 1.2);
  };
  if (location.hash === '#solid') document.body.classList.add('solid');
  render(3);
</script>
</body>
</html>
